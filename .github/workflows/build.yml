name: Build & Release
on:
  release:
    types: [created]

env:
  CI: true

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Update mod version
        uses: christian-draeger/write-properties@1.0.1
        with:
          path: 'gradle.properties'
          property: 'mod_version'
          value: ${{ github.event.release.tag_name }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and upload
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build curseforge modrinth publish
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}

      - name: Upload forge jar to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: forge/build/libs/content_packs-forge-${{ github.event.release.tag_name }}.jar

      - name: Upload fabric jar to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: fabric/build/libs/content_packs-fabric-${{ github.event.release.tag_name }}.jar